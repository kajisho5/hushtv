l="#E8ECF6" text-anchor="start" opacity="1">Connect</text><text x="72" y="212" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="11" font-weight="400" fill="#6B7699" text-anchor="start" opacity="1">Find your TV</text><circle cx="46" cy="266" r="13" fill="none" stroke="#6B7699" stroke-width="1.6"/><text x="46" y="271" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="13" font-weight="700" fill="#6B7699" text-anchor="middle" opacity="1">2</text><text x="72" y="262" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="15" font-weight="500" fill="#9AA6C4" text-anchor="start" opacity="1">Clean up</text><text x="72" y="280" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="11" font-weight="400" fill="#6B7699" text-anchor="start" opacity="1">Switch off the bloat</text><circle cx="46" cy="334" r="13" fill="none" stroke="#6B7699" stroke-width="1.6"/><text x="46" y="339" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="13" font-weight="700" fill="#6B7699" text-anchor="middle" opacity="1">3</text><text x="72" y="330" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="15" font-weight="500" fill="#9AA6C4" text-anchor="start" opacity="1">Home screen</text><text x="72" y="348" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="11" font-weight="400" fill="#6B7699" text-anchor="start" opacity="1">An ad-free home</text><circle cx="46" cy="402" r="13" fill="none" stroke="#6B7699" stroke-width="1.6"/><text x="46" y="407" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="13" font-weight="700" fill="#6B7699" text-anchor="middle" opacity="1">4</text><text x="72" y="398" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="15" font-weight="500" fill="#9AA6C4" text-anchor="start" opacity="1">Check</text><text x="72" y="416" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="11" font-weight="400" fill="#6B7699" text-anchor="start" opacity="1">Fix it after updates</text><circle cx="46" cy="470" r="13" fill="none" stroke="#6B7699" stroke-width="1.6"/><text x="46" y="475" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="13" font-weight="700" fill="#6B7699" text-anchor="middle" opacity="1">5</text><text x="72" y="466" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="15" font-weight="500" fill="#9AA6C4" text-anchor="start" opacity="1">Finish</text><text x="72" y="484" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="11" font-weight="400" fill="#6B7699" text-anchor="start" opacity="1">Close debugging</text><rect x="16" y="586" width="228" height="44" rx="10" fill="#1A2340" stroke="#FBBF24" stroke-width="1" opacity="1"/><path d="M34 600l8 16h-16z" fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-linejoin="round"/><text x="56" y="614" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="13" font-weight="700" fill="#E8ECF6" text-anchor="start" opacity="1">Repair a TV</text><rect x="24" y="642" width="212" height="32" rx="8" fill="#141C33" stroke="#263152" stroke-width="1" opacity="1"/><rect x="27" y="645" width="102" height="26" rx="6" fill="#1A2340" opacity="1"/><text x="78" y="663" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="700" fill="#E8ECF6" text-anchor="middle">English</text><text x="182" y="663" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#6B7699" text-anchor="middle">日本語</text><line x1="24" y1="690" x2="236" y2="690" stroke="#263152"/><text x="24" y="716" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">Nothing is uninstalled.</text><text x="24" y="736" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">Every change can be undone.</text><text x="24" y="768" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" font-weight="400" fill="#6B7699" text-anchor="start" opacity="1">hushtv v0.1.0 · MIT</text><text x="300" y="70" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="26" font-weight="700" fill="#E8ECF6" text-anchor="start" opacity="1">Repair a TV</text><text x="300" y="98" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="13" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">Diagnose a TV that misbehaves after a debloat with cleanyourtv, CleanMyTV or adb.</text><text x="300" y="118" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="13" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">Repairs only turn things back on. Nothing is switched off or removed.</text><rect x="300" y="136" width="600" height="420" rx="14" fill="#141C33" stroke="#263152" stroke-width="1" opacity="1"/><text x="324" y="168" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="16" font-weight="700" fill="#E8ECF6" text-anchor="start" opacity="1">Problems found</text><rect x="316" y="186" width="568" height="62" rx="10" fill="#1A2340" opacity="1"/><rect x="330" y="202" width="30" height="30" rx="15" fill="#3A1A22" opacity="1"/><text x="345" y="222" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="13" font-weight="700" fill="#F87171" text-anchor="middle" opacity="1">!!</text><text x="374" y="214" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="14" font-weight="600" fill="#E8ECF6" text-anchor="start" opacity="1">Home has no working launcher</text><text x="374" y="234" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">Now: the setup screen (black screen)</text><rect x="316" y="258" width="568" height="62" rx="10" fill="#1A2340" opacity="1"/><rect x="330" y="274" width="30" height="30" rx="15" fill="#3A1A22" opacity="1"/><text x="345" y="294" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="13" font-weight="700" fill="#F87171" text-anchor="middle" opacity="1">!!</text><text x="374" y="286" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="14" font-weight="600" fill="#E8ECF6" text-anchor="start" opacity="1">2 core Android packages are off</text><text x="374" y="306" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">Causes boot loops</text><rect x="316" y="330" width="568" height="62" rx="10" fill="#1A2340" opacity="1"/><rect x="330" y="346" width="30" height="30" rx="15" fill="#3A2E12" opacity="1"/><text x="345" y="366" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="middle" opacity="1">!</text><text x="374" y="358" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="14" font-weight="600" fill="#E8ECF6" text-anchor="start" opacity="1">1 input/tuner package is off</text><text x="374" y="378" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">Causes HDMI &quot;No Signal&quot;</text><rect x="316" y="402" width="568" height="62" rx="10" fill="#1A2340" opacity="1"/><rect x="330" y="418" width="30" height="30" rx="15" fill="#3A2E12" opacity="1"/><text x="345" y="438" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="middle" opacity="1">!</text><text x="374" y="430" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="14" font-weight="600" fill="#E8ECF6" text-anchor="start" opacity="1">The setup wizard is off</text><text x="374" y="450" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">Wi-Fi disappears, casting fails</text><rect x="316" y="474" width="568" height="62" rx="10" fill="#1A2340" opacity="1"/><rect x="330" y="490" width="30" height="30" rx="15" fill="#1A2340" opacity="1"/><text x="345" y="510" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="13" font-weight="700" fill="#9AA6C4" text-anchor="middle" opacity="1">-</text><text x="374" y="502" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="14" font-weight="600" fill="#E8ECF6" text-anchor="start" opacity="1">31 apps from the debloat lists are off</text><text x="374" y="522" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">Turned back on only with &quot;Everything&quot;</text><rect x="930" y="136" width="310" height="420" rx="14" fill="#141C33" stroke="#263152" stroke-width="1" opacity="1"/><text x="954" y="168" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="16" font-weight="700" fill="#E8ECF6" text-anchor="start" opacity="1">Choose a repair</text><rect x="946" y="186" width="278" height="92" rx="10" fill="#1A2340" stroke="#5EEAD4" stroke-width="1.6" opacity="1"/><circle cx="966" cy="210" r="8" fill="none" stroke="#5EEAD4" stroke-width="2"/><circle cx="966" cy="210" r="4" fill="#5EEAD4"/><text x="984" y="215" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="14" font-weight="700" fill="#E8ECF6" text-anchor="start" opacity="1">Quick fix (recommended)</text><text x="966" y="242" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">Turns back on only what boot, Home,</text><text x="966" y="260" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">Settings, inputs and Wi-Fi need</text><rect x="946" y="290" width="278" height="92" rx="10" fill="#141C33" stroke="#263152" stroke-width="1" opacity="1"/><circle cx="966" cy="314" r="8" fill="none" stroke="#6B7699" stroke-width="2"/><text x="984" y="319" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="14" font-weight="700" fill="#E8ECF6" text-anchor="start" opacity="1">Replay a restore record</text><text x="966" y="346" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">1 record from cleanyourtv or</text><text x="966" y="364" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">CleanMyTV found (Oct 30)</text><rect x="946" y="394" width="278" height="92" rx="10" fill="#141C33" stroke="#263152" stroke-width="1" opacity="1"/><circle cx="966" cy="418" r="8" fill="none" stroke="#6B7699" stroke-width="2"/><text x="984" y="423" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="14" font-weight="700" fill="#E8ECF6" text-anchor="start" opacity="1">Everything</text><text x="966" y="450" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">Turns every app the debloat</text><text x="966" y="468" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">lists switch off back on</text><rect x="946" y="500" width="278" height="44" rx="10" fill="#5EEAD4" opacity="1"/><text x="1085.0" y="527.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="14" font-weight="700" fill="#06201D" text-anchor="middle" opacity="1">Repair (turn back on)</text><rect x="300" y="576" width="940" height="124" rx="14" fill="#141C33" stroke="#263152" stroke-width="1" opacity="1"/><text x="324" y="606" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="15" font-weight="700" fill="#E8ECF6" text-anchor="start" opacity="1">If the TV can&#x27;t be reached</text><text x="324" y="636" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="start" opacity="1">Wi-Fi is gone</text><text x="324" y="658" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">Plug in Ethernet, or</text><text x="324" y="676" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">re-join Wi-Fi in Settings</text><text x="630" y="636" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="start" opacity="1">Black screen</text><text x="630" y="658" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">Open Settings with the remote,</text><text x="630" y="676" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">turn debugging on, try again</text><text x="936" y="636" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="start" opacity="1">Stuck on the logo</text><text x="936" y="658" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">No tool can reach it.</text><text x="936" y="676" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#9AA6C4" text-anchor="start" opacity="1">Factory reset from recovery</text><line x1="260" y1="716" x2="1280" y2="716" stroke="#263152"/><text x="300" y="754" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="13" font-weight="600" fill="#9AA6C4" text-anchor="start" opacity="1">▲ Log</text><rect x="470" y="732" width="200" height="44" rx="10" fill="none" stroke="#9AA6C4" stroke-width="1.2" opacity="1"/><text x="570.0" y="759.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="14" font-weight="600" fill="#E8ECF6" text-anchor="middle" opacity="1">Diagnose only</text><text x="1240" y="759" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',sans-serif" font-size="12" font-weight="400" fill="#6B7699" text-anchor="end" opacity="1">Reboot the TV afterwards and check it</text></svg>