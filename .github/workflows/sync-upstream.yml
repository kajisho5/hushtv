# 毎週、cleanyourtv の機種別リストを取り込む。変わっていて、テストが通れば main に直接入れる
# （プルリクエストを作らないので、リポの設定変更は要らない）。
name: sync-upstream
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git clone --depth 1 https://github.com/Gathin23/cleanyourtv /tmp/cleanyourtv
      - run: python3 -I scripts/sync_upstream.py /tmp/cleanyourtv
      - id: diff
        run: |
          if git diff --quiet -- data; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "変わりなし"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.diff.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.diff.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
      - name: 取り込んだリストでテスト（全部のリストが読めるか・安全装置）
        if: steps.diff.outputs.changed == 'true'
        run: cargo test -p hushtv-core --locked
      - name: main に入れる
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "hushtv-bot"
          git config user.email "info@seventh-well.com"
          git add data
          git commit -m "cleanyourtv の機種別リストを取り込み（$(date +%Y-%m-%d)）"
          git push origin HEAD:main
  # 取り込んだコミットのホーム画面アプリを作り直す（同じコミットなら何もしない）
  launcher:
    needs: sync
    uses: ./.github/workflows/launcher.yml
    secrets: inherit
