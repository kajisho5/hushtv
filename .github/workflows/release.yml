# main に入ったとき、Cargo.toml のバージョン番号がまだリリースされていなければ、自動でリリースを作る。
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
# 続けて push したとき、同じバージョンのリリースを二重に作らない
concurrency:
  group: release
  cancel-in-progress: true
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$tag はリリース済みです"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "$tag をリリースします"
          fi
  build:
    needs: version
    if: needs.version.outputs.new == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: hushtv-linux-x86_64, exe: hushtv }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: hushtv-linux-arm64, exe: hushtv }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: hushtv-windows-x86_64, exe: hushtv.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p hushtv-cli --target ${{ matrix.target }}
      - name: まとめる
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.name }}
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} dist/${{ matrix.name }}/
          cp README.md LICENSE THIRD-PARTY-NOTICES.md dist/${{ matrix.name }}/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a ${{ matrix.name }}.zip ${{ matrix.name }} >/dev/null; else tar czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}; fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.*
  app:
    needs: version
    if: needs.version.outputs.new == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: "appimage,deb" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundles: "nsis" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux の部品
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-${{ matrix.target }}
      - run: npm ci --prefix ui
      - name: アプリを作る
        shell: bash
        working-directory: crates/hushtv-app
        env:
          # 自動アップデートの署名鍵（runway の tauri-updater-key が入れる）。無いうちは署名なしで作る
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          extra=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then extra=(--config '{"bundle":{"createUpdaterArtifacts":true}}'); fi
          # 部品のダウンロードが GitHub 側の一時的なエラー（504 など）で落ちることがあるので 5 回まで試す
          for i in 1 2 3 4 5; do
            ../../ui/node_modules/.bin/tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} "${extra[@]}" && exit 0
            echo "::warning::作り直します（$i 回目が失敗）"; sleep $((i * 60))
          done
          exit 1
      - name: まとめる
        shell: bash
        run: |
          mkdir -p dist
          find target/${{ matrix.target }}/release/bundle -maxdepth 2 -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.sig" \) -exec cp {} dist/ \;
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.target }}
          path: dist/*
  # Mac のアプリは kajisho5/runway で作る：Apple Silicon と Intel 両方入りの .app → Developer ID 署名 → Apple の公証 → dmg
  mac:
    needs: version
    if: needs.version.outputs.new == 'true'
    uses: kajisho5/runway/.github/workflows/mac-notarize.yml@main
    with:
      name: hushtv
      version: ${{ needs.version.outputs.version }}
      build: >-
        rustup toolchain install stable --profile minimal
        && rustup default stable
        && rustup target add aarch64-apple-darwin x86_64-apple-darwin
        && npm ci --prefix ui
        && cd crates/hushtv-app
        && ../../ui/node_modules/.bin/tauri build --target universal-apple-darwin --bundles app
      products: target/universal-apple-darwin/release/bundle/macos/hushtv.app
      app_link: true
    secrets: inherit
  # Mac のコマンド版も runway で：Apple Silicon と Intel をひとつにまとめて Developer ID 署名 → 公証 → zip
  mac-cli:
    needs: version
    if: needs.version.outputs.new == 'true'
    uses: kajisho5/runway/.github/workflows/mac-notarize.yml@main
    with:
      name: hushtv-cli
      version: ${{ needs.version.outputs.version }}
      package: zip
      build: >-
        rustup toolchain install stable --profile minimal
        && rustup default stable
        && rustup target add aarch64-apple-darwin x86_64-apple-darwin
        && cargo build --release --locked -p hushtv-cli --target aarch64-apple-darwin
        && cargo build --release --locked -p hushtv-cli --target x86_64-apple-darwin
        && mkdir -p dist/cli
        && lipo -create -output dist/cli/hushtv target/aarch64-apple-darwin/release/hushtv target/x86_64-apple-darwin/release/hushtv
      products: dist/cli/hushtv
    secrets: inherit
  # Mac の自動アップデート用：署名・公証済みの .app を固めて、更新用の鍵で署名する
  mac-updater:
    needs: [version, mac]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: hushtv-notarized
          path: dmg
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: 固めて署名
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "::notice::更新用の鍵がまだないので省略"; exit 0; fi
          npm ci --prefix ui
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dmg/*.dmg
          out="dist/hushtv_${VERSION}_macos-universal.app.tar.gz"
          tar -czf "$out" -C "$mnt" hushtv.app
          hdiutil detach "$mnt"
          ui/node_modules/.bin/tauri signer sign "$out"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: mac-updater
          path: dist/*
          if-no-files-found: ignore
  publish:
    needs: [version, build, app, mac, mac-cli, mac-updater]
    # Mac の署名が失敗しても、ほかの OS のリリースは止めない
    if: always() && needs.version.outputs.new == 'true' && needs.build.result == 'success' && needs.app.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Mac の dmg の名前をそろえる
        run: |
          ver="${{ needs.version.outputs.tag }}"; ver="${ver#v}"
          if [ -f "dist/hushtv-$ver.dmg" ]; then mv "dist/hushtv-$ver.dmg" "dist/hushtv_${ver}_macos-universal.dmg"; else echo "::warning::Mac の dmg がありません（署名・公証のジョブを確認）"; fi
          if [ -f "dist/hushtv-cli-$ver.zip" ]; then mv "dist/hushtv-cli-$ver.zip" "dist/hushtv-macos-universal.zip"; else echo "::warning::Mac のコマンド版がありません（署名・公証のジョブを確認）"; fi
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cd ..
          tag="${{ needs.version.outputs.tag }}"
          pre=""
          case "$tag" in *-*) pre="--prerelease" ;; esac
          gh release create "$tag" dist/* $pre \
            --title "hushtv ${{ needs.version.outputs.tag }}" \
            --notes-file docs/release-notes.md
      - name: Homebrew・Scoop・自動アップデートの定義を更新
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 scripts/packages.py "$VERSION" dist
          if [ -n "$(git status --porcelain Formula Casks bucket updater)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Formula Casks bucket updater
            git commit -m "Homebrew・Scoop・自動アップデートを $VERSION に更新"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
